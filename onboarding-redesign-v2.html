  /* ── Exact v8.36.1 Design System Tokens (Dark — spec §5.4) ── */
  :root {
    --canvas:     #05060A;
    --surf:       rgba(255,255,255,.035);
    --surf-2:     rgba(255,255,255,.06);
    --surf-solid: #0B0D14;
    --line:       rgba(255,255,255,.09);
    --line-2:     rgba(255,255,255,.15);
    --text:       #F2F4F8;
    --dim:        #98A0B2;
    --faint:      #636A7C;
    --lift:       0 18px 48px -18px rgba(0,0,0,.85);

    /* Category hues (v8.36.1) */
    --cyan:    #1ADDE3;   /* Dashboard / primary accent */
    --emerald: #21C97A;   /* Income */
    --violet:  #9B7BFF;   /* Deductions */
    --navy:    #4B87FF;   /* Tax */
    --amber:   #F2A32B;   /* Prior-year balances */
    --rose:    #FF6FB5;   /* Provisional tax */
    --blue:    #5D7CA7;   /* PAYE / info notes */
    --ico-pink:#FF6FB5;
    --teal:    #1ADDE3;

    /* Semantic hues (v8.36.1) */
    --mint:    #5DF2B8;   /* saving / refund */
    --red:     #FF5C7A;   /* owing */
    --neutral: #8B94AB;
    --on-accent: #04060C;

    /* Legacy remap (v8.36.1) */
    --bg:      var(--canvas);
    --bg2:     #080A11;
    --bg1:     #0E1119;
    --sf:      var(--surf-solid);
    --sf2:     #11141D;
    --sf3:     #191D28;
    --bd:      var(--line);
    --tx:      var(--text);
    --tx2:     #C2C9D6;
    --tx3:     var(--dim);
    --accent:  var(--cyan);
    --accent-bright: var(--cyan);
    --au:      var(--emerald);
    --tebg:    rgba(75,135,255,0.12);
    --focus-ring: 0 0 0 3px color-mix(in srgb, var(--accent) 28%, transparent);

    --r: 14px;
    --r-sm: 12px;
    --r-pill: 9999px;
    --ff: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --fh: 'Space Grotesk', 'Inter', sans-serif;
    --fnum: 'Space Grotesk', 'Inter', sans-serif;
  }

  /* ── Exact v8.36.1 Light Theme Tokens ── */
  [data-theme="light"] {
    --canvas:     #F3F5FA;
    --surf:       #FFFFFF;
    --surf-2:     #FFFFFF;
    --surf-solid: #FFFFFF;
    --line:       rgba(11,18,32,.09);
    --line-2:     rgba(11,18,32,.16);
    --text:       #0B1220;
    --dim:        #5A6478;
    --faint:      #8A93A6;
    --lift:       0 14px 34px -16px rgba(11,18,32,.28);

    --cyan:    #097C82;
    --emerald: #0A8153;
    --violet:  #6A4BE0;
    --navy:    #0B52DA;
    --amber:   #9A6109;
    --rose:    #A81E63;
    --blue:    #3B547A;
    --ico-pink:#C2416B;
    --teal:    #097C82;

    --mint:    #097852;
    --red:     #C7264A;
    --neutral: #646D7F;
    --on-accent: #FFFFFF;

    --bg:      var(--canvas);
    --bg2:     #EDF0F6;
    --bg1:     #FFFFFF;
    --sf:      var(--surf-solid);
    --sf2:     #F4F6F9;
    --sf3:     #E7EBF1;
    --bd:      var(--line);
    --tx:      var(--text);
    --tx2:     #3C4557;
    --tx3:     var(--dim);
    --accent:  var(--cyan);
    --accent-bright: var(--cyan);
    --au:      var(--emerald);
    --tebg:    rgba(11,82,218,0.09);
    color-scheme: light;
  }

  .ico-bg-navy   { --ico-c: var(--navy); }
  .ico-bg-mint   { --ico-c: var(--cyan); }
  .ico-bg-green  { --ico-c: var(--emerald); }
  .ico-bg-pink   { --ico-c: var(--ico-pink); }
  .ico-bg-purple { --ico-c: var(--violet); }
  .ico-bg-amber  { --ico-c: var(--amber); }
  .ico-bg-orange { --ico-c: var(--amber); }
  .ico-bg-grey   { --ico-c: var(--neutral); }
  .ico-bg-teal   { --ico-c: var(--cyan); }
  .ico-bg-blue   { --ico-c: var(--blue); }
  .ico-bg-rose   { --ico-c: var(--rose); }

  * { box-sizing: border-box; }
  @media (max-width: 480px) { body { padding: 8px; } .phone-shell { width: 100%; height: 92dvh; border-radius: 18px; } }
  body {
    margin: 0;
    background: #03050a;
    color: var(--text);
    font-family: var(--ff);
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
    padding: 16px;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .inspector {
    width: 350px;
    max-width: 100%;
    background: #0B0D14;
    color: #F2F4F8;
    border: 1px solid rgba(255,255,255,.09);
    border-radius: 16px;
    padding: 16px;
    font-size: 13px;
    line-height: 1.45;
    align-self: flex-start;
  }
  .inspector h1 { font-family: var(--fh); font-size: 15px; margin: 0 0 8px; color: #1ADDE3; }
  .inspector h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #98A0B2; margin: 14px 0 6px; }
  .inspector pre {
    background: #05060A;
    border: 1px solid rgba(255,255,255,.09);
    border-radius: 10px;
    padding: 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    overflow-x: auto;
    white-space: pre-wrap;
    margin: 6px 0;
    color: #5DF2B8;
  }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    background: color-mix(in srgb, var(--accent) 16%, transparent);
    color: var(--accent);
    border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
  }
  .ins-btn {
    width: 100%;
    padding: 9px 11px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,.11);
    background: #11141D;
    color: #F2F4F8;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 6px;
    text-align: left;
  }
  .ins-btn:hover { border-color: #1ADDE3; }

  /* ── v8.36.1 Lit-Canvas Phone Shell ── */
  .phone-shell {
    width: 360px;
    height: 700px;
    background:
      radial-gradient(78% 44% at 6% -6%, rgba(26,221,227,.10), transparent 62%),
      radial-gradient(60% 40% at 104% 4%, rgba(155,123,255,.11), transparent 60%),
      var(--canvas);
    border: 2px solid rgba(255,255,255,.14);
    border-radius: 26px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 24px 60px rgba(0,0,0,.65);
    position: relative;
  }
  [data-theme="light"] .phone-shell {
    background:
      radial-gradient(72% 40% at 4% -8%, rgba(12,143,151,.07), transparent 60%),
      radial-gradient(58% 36% at 106% 2%, rgba(106,69,224,.06), transparent 58%),
      var(--canvas);
    border-color: rgba(11,18,32,.18);
  }

  /* ── v8.36.1 Onboarding Header + Brand Mark + Stepper Dots ── */
  .ob-header {
    background: var(--sf);
    border-bottom: 1px solid var(--bd);
    padding: 12px 14px 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
    position: relative;
  }
  .ob-header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .ob-header-left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
    flex: 1;
  }
  .tlogo-dark, .tlogo-light {
    width: 38px;
    height: 38px;
    object-fit: contain;
    flex-shrink: 0;
  }
  .tlogo-light { display: none; }
  [data-theme="light"] .tlogo-dark { display: none; }
  [data-theme="light"] .tlogo-light { display: inline-block; }

  .ob-subtitle-hdr {
    font-size: 12px;
    color: var(--tx3);
    line-height: 1.3;
    min-width: 0;
  }
  .ob-header-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .ob-skip-btn {
    background: transparent;
    border: 1px solid color-mix(in srgb, var(--accent) 42%, var(--bd));
    color: var(--accent);
    border-radius: var(--r-pill);
    font-size: 11.5px;
    font-weight: 600;
    padding: 6px 11px;
    cursor: pointer;
    white-space: nowrap;
  }
  .ob-skip-btn:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .ob-theme-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--bd);
    background: var(--sf);
    color: var(--tx2);
    cursor: pointer;
    display: grid;
    place-items: center;
    flex-shrink: 0;
  }
  .ob-theme-btn:hover { color: var(--tx); border-color: var(--tx3); }

  /* Exact v8.36.1 Stepper Dots */
  .stepper-indicators {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .stepper-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--sf3);
    transition: all .2s;
    cursor: pointer;
    border: 0;
    padding: 0;
  }
  .stepper-dot.completed {
    background: var(--accent);
    opacity: .55;
  }
  .stepper-dot.active {
    background: var(--accent);
    width: 32px;
    border-radius: 12px;
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 16%, transparent);
  }

  /* ── Content Area ── */
  .ob-content {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px 20px;
    background: transparent;
  }
  .ob-title {
    margin: 0 0 6px;
    font-family: var(--fh);
    font-size: 22px;
    font-weight: 700;
    color: var(--cyan);
    line-height: 1.2;
    text-align: center;
  }
  .ob-sub {
    margin: 0 0 14px;
    font-size: 12.5px;
    color: var(--tx3);
    line-height: 1.45;
    text-align: center;
  }
  .sec-h {
    font-family: var(--fh);
    font-size: 14px;
    font-weight: 700;
    color: var(--tx);
    margin: 16px 0 6px;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .sec-h .material-symbols-outlined {
    font-size: 18px;
    color: var(--accent);
  }
  .sec-sub {
    font-size: 12px;
    color: var(--tx3);
    margin: 0 0 10px;
    line-height: 1.4;
  }
  .note-box {
    background: var(--tebg);
    border: 1px solid var(--bd);
    border-radius: 10px;
    padding: 11px 13px;
    font-size: 12.5px;
    color: var(--tx2);
    line-height: 1.5;
    margin: 10px 0;
  }
  .note-warn {
    background: color-mix(in srgb, var(--amber) 11%, var(--sf));
    border-color: color-mix(in srgb, var(--amber) 42%, transparent);
    color: var(--tx);
  }
  .note-ok {
    background: color-mix(in srgb, var(--emerald) 11%, var(--sf));
    border-color: color-mix(in srgb, var(--emerald) 38%, transparent);
    color: var(--tx);
  }
  .field-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--tx2);
    margin-bottom: 6px;
  }
  .select-in, .text-in {
    width: 100%;
    min-height: 46px;
    background: var(--sf2);
    border: 1px solid var(--bd);
    border-radius: 14px;
    color: var(--tx);
    padding: 11px 14px;
    font-size: 14px;
    font-family: inherit;
    transition: border-color .15s, box-shadow .15s;
  }
  .select-in:focus, .text-in:focus {
    outline: none;
    border-color: var(--accent-bright);
    box-shadow: var(--focus-ring);
  }
  .text-in.mono { font-family: var(--fnum); font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ── Exact v8.36.1 Choice Tiles + Lip-v3 Icon Chips ── */
  .tile-grid { display: grid; grid-template-columns: 1fr; gap: 9px; }
  .tile {
    display: flex;
    align-items: center;
    gap: 11px;
    min-height: 54px;
    padding: 11px 12px;
    border-radius: 16px;
    background: var(--bg1);
    border: 1.25px solid var(--bd);
    color: var(--tx);
    cursor: pointer;
    text-align: left;
    transition: border-color .16s, background-color .16s, transform .12s;
    position: relative;
  }
  [data-theme="light"] .tile {
    background: var(--sf);
    box-shadow: 0 1px 2px rgba(16,24,40,.04);
  }
  .tile:hover { border-color: var(--accent); }
  .tile.selected {
    border-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 12%, var(--bg1));
  }
  /* v8.36.1 A2: Income tiles in dark mode use emerald selected outline */
  :root:not([data-theme="light"]) .tile.tile-income.selected {
    border-color: var(--emerald);
    background: color-mix(in srgb, var(--emerald) 12%, var(--bg1));
  }
  :root:not([data-theme="light"]) .tile.tile-income.selected .tile-chk {
    background: var(--emerald);
  }
  /* Deductions tiles use violet category accent */
  .tile.tile-ded.selected {
    border-color: var(--violet);
    background: color-mix(in srgb, var(--violet) 12%, var(--bg1));
  }
  .tile.tile-ded.selected .tile-chk { background: var(--violet); }
  /* Carried-forward balances use amber category accent */
  .tile.tile-bal.selected {
    border-color: var(--amber);
    background: color-mix(in srgb, var(--amber) 12%, var(--bg1));
  }
  .tile.tile-bal.selected .tile-chk { background: var(--amber); }

  /* Exact v8.36.1 Lip v3 Icon Chip (Option D: tinted face + full-chroma offset lip) */
  .tile-ico {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    background-color: color-mix(in srgb, var(--ico-c, var(--cyan)) 15%, var(--surf-solid));
    border: 1.25px solid color-mix(in srgb, var(--ico-c, var(--cyan)) 22%, transparent);
    color: var(--ico-c, var(--cyan));
    box-shadow: -2.75px 2.75px 0 0 color-mix(in srgb, var(--ico-c, var(--cyan)) 80%, transparent);
    display: grid;
    place-items: center;
    flex-shrink: 0;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  [data-theme="light"] .tile-ico {
    background-color: color-mix(in srgb, var(--ico-c, var(--cyan)) 8%, var(--surf-solid));
  }
  .tile:active .tile-ico {
    transform: translate(-1.5px, 1.5px);
    box-shadow: -2px 2px 0 0 var(--ico-c, var(--cyan));
  }
  .tile-body { flex: 1; min-width: 0; }
  .tile-name { font-size: 13.5px; font-weight: 600; display: block; color: var(--tx); line-height: 1.28; }
  .tile-desc { font-size: 12px; color: var(--tx3); display: block; margin-top: 2px; line-height: 1.35; }
  .tile-chk {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1.5px solid var(--line-2);
    display: grid;
    place-items: center;
    font-size: 11px;
    font-weight: 800;
    flex-shrink: 0;
    color: transparent;
    transition: all .15s;
  }
  .tile.selected .tile-chk {
    background: var(--accent);
    border-color: transparent;
    color: var(--on-accent);
  }

  .sub-panel {
    margin: 4px 0 8px;
    padding: 12px;
    background: color-mix(in srgb, var(--violet) 7%, var(--sf));
    border: 1px dashed var(--line-2);
    border-radius: 12px;
  }

  details.ob-details {
    margin-top: 14px;
    background: var(--sf);
    border: 1px solid var(--bd);
    border-radius: 14px;
    padding: 12px 13px;
  }
  [data-theme="light"] details.ob-details {
    box-shadow: 0 1px 2px rgba(16,24,40,.05), 0 10px 26px -16px rgba(16,24,40,.22);
  }
  details.ob-details summary {
    cursor: pointer;
    font-family: var(--fh);
    font-size: 13.5px;
    font-weight: 700;
    color: var(--amber);
    list-style: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  details.ob-details summary::-webkit-details-marker { display: none; }

  /* Exact v8.36.1 Yes/No Radio Tiles (affirmative Yes = emerald) */
  .yn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 6px; }
  .yn-btn {
    position: relative;
    min-height: 52px;
    padding: 10px 12px;
    border-radius: 12px;
    border: 1.5px solid var(--bd);
    background: var(--bg1);
    color: var(--tx);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all .16s;
  }
  [data-theme="light"] .yn-btn { background: var(--sf); }
  .yn-btn:hover { border-color: var(--accent); }
  .yn-btn.selected {
    border-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 12%, var(--bg1));
  }
  .yn-btn.yn-yes.selected {
    border-color: var(--emerald);
    background: color-mix(in srgb, var(--emerald) 12%, var(--bg1));
    color: var(--tx);
  }

  .card {
    background: var(--sf);
    border: 1px solid var(--bd);
    border-radius: 14px;
    padding: 13px 14px;
    margin-top: 12px;
  }
  [data-theme="light"] .card {
    box-shadow: 0 1px 2px rgba(16,24,40,.05), 0 10px 26px -16px rgba(16,24,40,.28);
  }
  .slider-block {
    padding: 10px 0;
    border-bottom: 1px solid var(--bd);
  }
  .slider-block:last-of-type { border-bottom: none; padding-bottom: 4px; }
  .slider-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .slider-head .val { font-family: var(--fnum); color: var(--accent); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .slider-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 4px 8px;
    font-size: 11.5px;
    color: var(--tx3);
    margin-top: 3px;
  }
  .max-chip {
    background: color-mix(in srgb, var(--accent) 14%, var(--sf2));
    border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
    color: var(--accent);
    border-radius: var(--r-pill);
    padding: 3px 9px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
  }
  input[type="range"] { width: 100%; accent-color: var(--accent); margin: 4px 0; }

  .hero {
    background: linear-gradient(145deg, color-mix(in srgb, var(--cyan) 12%, var(--sf)), var(--sf));
    border: 1px solid color-mix(in srgb, var(--cyan) 30%, var(--bd));
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
  }
  [data-theme="light"] .hero {
    background: var(--sf);
    box-shadow: 0 1px 2px rgba(16,24,40,.05), 0 10px 26px -16px rgba(16,24,40,.28);
  }
  .hero-amt {
    font-family: var(--fnum);
    font-size: 28px;
    font-weight: 700;
    margin: 4px 0;
    font-variant-numeric: tabular-nums;
  }
  .sum-row {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px solid var(--bd);
    font-size: 12.5px;
  }
  .sum-row strong { font-family: var(--fnum); font-variant-numeric: tabular-nums; }
  .sum-row:last-child { border-bottom: none; }

  .prov-row {
    padding: 8px 0;
    border-bottom: 1px solid var(--bd);
  }
  .prov-row:last-child { border-bottom: none; padding-bottom: 0; }
  .prov-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 13px;
    font-weight: 700;
  }
  .prov-sub {
    display: flex;
    justify-content: space-between;
    font-size: 11.5px;
    color: var(--tx3);
    margin-top: 2px;
  }

  /* ── Exact v8.36.1 Pinned Action Footer ── */
  .ob-footer {
    background: var(--sf);
    border-top: 1px solid var(--bd);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-shrink: 0;
    box-shadow: 0 -4px 14px rgba(0,0,0,.18);
  }
  .ob-progress-text {
    font-size: 12px;
    line-height: 1.15;
    color: var(--tx3);
    text-align: center;
    flex-shrink: 0;
    min-width: 44px;
  }
  .ob-btn-group {
    display: flex;
    gap: 8px;
    flex: 1;
    justify-content: flex-end;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    padding: 10px 20px;
    border-radius: var(--r-pill);
    border: none;
    background: var(--sf3);
    color: var(--tx);
    font-family: var(--ff);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color .15s, opacity .15s;
  }
  .btn:hover { background: var(--sf2); }
  .btn-primary {
    flex: 1 1 auto;
    background: var(--accent);
    color: var(--on-accent);
  }
  .btn-primary:hover { background: color-mix(in srgb, var(--accent) 88%, var(--text)); }
  .btn-complete {
    flex: 1 1 auto;
    background: var(--au);
    color: var(--on-accent);
  }

  .fx-preview-sheet {
    position: absolute;
    inset: 0;
    background: var(--bg);
    z-index: 50;
    display: none;
    flex-direction: column;
  }
  .fx-preview-sheet.open { display: flex; }
  .multi-dd {
    background: var(--sf);
    border: 1px solid var(--bd);
    border-radius: 12px;
    padding: 10px 12px;
    margin-bottom: 10px;
  }
  .multi-dd-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .fx-card {
    background: var(--sf);
    border: 1px solid var(--bd);
    border-radius: 12px;
    padding: 11px;
    margin-top: 8px;
  }
  .fx-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
</style>
</head>

function isCurrentYear() { return state.taxYear === '2027'; }

function computeGoalLens() {
  if (isCurrentYear()) {
    const g = state.currentGoals;
    if (g.length === 0) return 'Current_Est_Plan_Prov';
    const hasEst = g.includes('est'), hasPlan = g.includes('plan'), hasProv = g.includes('prov');
    if (hasProv && !hasEst && !hasPlan) return 'Current_Prov';
    if ((hasEst || hasPlan) && !hasProv) return 'Current_Est_Plan';
    return 'Current_Est_Plan_Prov';
  }
  return state.priorGoal === 'est' ? 'Prior_Est' : 'Prior_Act';
}

function toggleArr(arr, id) {
  const i = arr.indexOf(id);
  if (i >= 0) arr.splice(i, 1); else arr.push(id);
  render();
}

function goStep(n) { state.step = Math.max(1, Math.min(4, n)); render(); }
function nextStep() { if (state.step < 4) goStep(state.step + 1); else alert('Onboarding complete! goalLens = ' + computeGoalLens()); }
function prevStep() { if (state.step > 1) goStep(state.step - 1); }
function toggleTheme() { document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; }
function fmtR(n) { return 'R ' + Math.round(Number(n) || 0).toLocaleString('en-ZA'); }

function calcBracketTax(ti, brackets) {
  const amt = Math.max(0, Math.floor(ti));
  for (const b of brackets) {
    if (amt <= b.max) {
      const prevMax = b.min > 0 ? b.min - 1 : 0;
      return b.base + (amt - prevMax) * b.rate;
    }
  }
  return 0;
}

function annualFactor() {
  if (state.period !== 'sofar') return 1;
  const m = Math.max(1, Math.min(11, Number(state.monthsCovered) || 12));
  return 12 / m;
}

function calcTaxPreview(overrides) {
  const s = Object.assign({}, state, overrides || {});
  const ty = TAX_YEARS[s.taxYear] || TAX_YEARS['2027'];
  const k = s.period === 'sofar' ? (12 / Math.max(1, Math.min(11, Number(s.monthsCovered) || 6))) : 1;

  const salaryAnn = s.income.includes('employment_income') ? s.roughSalary : 0;
  const payeAnn = s.income.includes('employment_income') ? s.roughPaye : 0;
  const bizTurnAnn = s.income.includes('business_income') ? s.roughBizTurnover * k : 0;
  const bizCostAnn = s.income.includes('business_income') ? s.roughBizExpenses * k : 0;
  const bizNetAnn = Math.max(0, bizTurnAnn - bizCostAnn);
  const rentalAnn = s.income.includes('rental_income') ? s.roughRentalNet * k : 0;
  const invGrossAnn = s.income.includes('investment_income') ? s.roughInv * k : 0;
  const intExcl = s.ageBand === 'u65' ? ty.interest.under65 : ty.interest.age65;
  const invTaxableAnn = Math.max(0, invGrossAnn - intExcl);
  const cryptoAnn = s.income.includes('crypto_income') ? s.roughCrypto * k : 0;
  const otherAnn = s.income.includes('other_income') ? s.roughOther * k : 0;

  const grossAnn = salaryAnn + bizNetAnn + rentalAnn + invTaxableAnn + cryptoAnn + otherAnn;

  // s11F Retirement Fund cap: 27.5% of greater of remuneration or taxable income before RA/donations, capped at ty.retirement.cap
  const raBase = Math.max(salaryAnn, grossAnn);
  const raMaxDed = Math.min(ty.retirement.cap, Math.round(raBase * (ty.retirement.pct / 100)));
  const raAllowed = Math.min(s.planRa, raMaxDed);
  const raExcess = Math.max(0, s.planRa - raAllowed);

  const tiBeforeDon = Math.max(0, grossAnn - raAllowed);

  // s18A Donations cap: 10% of taxable income before donations
  const donMaxDed = Math.round(tiBeforeDon * (ty.donationPct / 100));
  const donAllowed = Math.min(s.planDonations, donMaxDed);
  const donExcess = Math.max(0, s.planDonations - donAllowed);

  const taxableIncome = Math.max(0, tiBeforeDon - donAllowed);
  const normalTax = calcBracketTax(taxableIncome, ty.brackets);

  let rebates = ty.rebates.primary;
  if (s.ageBand === '65') rebates += ty.rebates.secondary;
  if (s.ageBand === '75') rebates += ty.rebates.secondary + ty.rebates.tertiary;

  // s6A Medical Scheme Fees Tax Credit + s6B Additional Medical Expenses Credit
  const members = s.medMember === 'yes' ? Math.max(1, Number(s.medMembers) || 1) : 0;
  let s6aMonthly = 0;
  if (members >= 1) s6aMonthly += ty.medical.main;
  if (members >= 2) s6aMonthly += ty.medical.firstDep;
  if (members > 2) s6aMonthly += (members - 2) * ty.medical.addDep;
  const s6aAnnual = s6aMonthly * 12;

  const isSeniorOrDis = s.ageBand === '65' || s.ageBand === '75' || s.medDisabled;
  let s6bCredit = 0;
  if (isSeniorOrDis) {
    const excessContrib = Math.max(0, s.planMedContrib - 3 * s6aAnnual);
    s6bCredit = Math.round((excessContrib + s.planMedOop) * (1 / 3));
  } else {
    const excessContrib = Math.max(0, s.planMedContrib - 4 * s6aAnnual);
    const qualPool = Math.max(0, (excessContrib + s.planMedOop) - 0.075 * taxableIncome);
    s6bCredit = Math.round(qualPool * 0.25);
  }
  const medTotal = Math.min(Math.max(0, normalTax - rebates), s6aAnnual + s6bCredit);

  // Second Schedule Lump Sum Tax
  const lsTable = s.planLumpSumType === 'withdrawal' ? ty.withdrawalLumpSum : ty.retirementLumpSum;
  const lsTaxFreeLimit = lsTable[0].max;
  const lsTax = s.planLumpSum > 0 ? Math.round(calcBracketTax(s.planLumpSum, lsTable)) : 0;

  const netNormalTax = Math.max(0, normalTax - rebates - medTotal);
  const totalTaxPayable = netNormalTax + lsTax;
  const creditsPaid = payeAnn + s.roughProvPaid;
  const balance = totalTaxPayable - creditsPaid;

  // Provisional Tax (IRP6) P1, P2, P3 & Para 20 Penalty-Safe Minimum
  const isHighIncome = taxableIncome > ty.para20Threshold;
  const p1Rec = Math.max(0, Math.round(0.5 * totalTaxPayable - 0.5 * payeAnn));
  const p2Rec = Math.max(0, Math.round(totalTaxPayable - payeAnn - p1Rec));
  const p3Rec = Math.max(0, Math.round(totalTaxPayable - payeAnn - s.roughProvPaid));

  const taxOn90 = Math.max(0, calcBracketTax(taxableIncome * 0.90, ty.brackets) - rebates - medTotal);
  const taxOn80 = Math.max(0, calcBracketTax(taxableIncome * 0.80, ty.brackets) - rebates - medTotal);
  const taxOnBasic = s.priorTaxableIncome > 0
    ? Math.max(0, calcBracketTax(s.priorTaxableIncome, ty.brackets) - rebates - medTotal)
    : null;

  const p2MinAnnual = isHighIncome
    ? taxOn80
    : (taxOnBasic !== null ? Math.min(taxOnBasic, taxOn90) : taxOn90);
  const p1Min = Math.max(0, Math.round(0.5 * (taxOnBasic !== null ? taxOnBasic : totalTaxPayable) - 0.5 * payeAnn));
  const p2Min = Math.max(0, Math.round(p2MinAnnual - payeAnn - p1Min));

  return {
    ty, k, grossAnn, bizTurnAnn, bizCostAnn, rentalAnn, invGrossAnn,
    raMaxDed, raAllowed, raExcess,
    donMaxDed, donAllowed, donExcess,
    taxableIncome, normalTax, rebates, s6aAnnual, s6bCredit, medTotal,
    lsTaxFreeLimit, lsTax, totalTaxPayable, creditsPaid, balance,
    p1Rec, p2Rec, p3Rec, p1Min, p2Min, isHighIncome
  };
}

function sliderCalibration(calc) {
  const baseInc = Math.max(120000, calc.grossAnn);
  const raMax = Math.max(60000, Math.min(calc.ty.retirement.cap, Math.ceil((baseInc * 0.35) / 5000) * 5000));
  const medContribMax = Math.max(48000, Math.ceil((baseInc * 0.15) / 2000) * 2000);
  const medOopMax = Math.max(24000, Math.ceil((baseInc * 0.08) / 1000) * 1000);
  const lsMax = Math.max(600000, Math.ceil((baseInc * 1.5) / 25000) * 25000);
  const donMax = Math.max(15000, Math.ceil((Math.max(50000, calc.grossAnn) * 0.15) / 1000) * 1000);
  return { raMax, medContribMax, medOopMax, lsMax, donMax };
}

function refreshLiveBlocks() {
  const calc = calcTaxPreview();
  const cal = sliderCalibration(calc);
  const el = id => document.getElementById(id);

  if (el('sl-ra')) { el('sl-ra').max = cal.raMax; }
  if (el('sl-medc')) { el('sl-medc').max = cal.medContribMax; }
  if (el('sl-medo')) { el('sl-medo').max = cal.medOopMax; }
  if (el('sl-ls')) { el('sl-ls').max = cal.lsMax; }
  if (el('sl-don')) { el('sl-don').max = cal.donMax; }

  if (el('val-ra')) el('val-ra').textContent = fmtR(state.planRa);
  if (el('val-medc')) el('val-medc').textContent = fmtR(state.planMedContrib);
  if (el('val-medo')) el('val-medo').textContent = fmtR(state.planMedOop);
  if (el('val-ls')) el('val-ls').textContent = fmtR(state.planLumpSum);
  if (el('val-don')) el('val-don').textContent = fmtR(state.planDonations);

  const noRaTax = calcTaxPreview({ planRa: 0 }).totalTaxPayable;
  const raSaved = Math.max(0, noRaTax - calc.totalTaxPayable);
  const noDonTax = calcTaxPreview({ planDonations: 0 }).totalTaxPayable;
  const donSaved = Math.max(0, noDonTax - calc.totalTaxPayable);

  if (el('cap-ra')) el('cap-ra').innerHTML = `Max deductible: <strong>${fmtR(calc.raMaxDed)}</strong> (27.5% / cap ${fmtR(calc.ty.retirement.cap)})`;
  if (el('eff-ra')) el('eff-ra').textContent = `Tax saved: ${fmtR(raSaved)}${calc.raExcess>0?' · Excess c/fwd: '+fmtR(calc.raExcess):''}`;
  if (el('eff-med')) el('eff-med').textContent = `s6A credit: ${fmtR(calc.s6aAnnual)} · s6B credit: ${fmtR(calc.s6bCredit)} · Total: ${fmtR(calc.medTotal)}`;
  if (el('eff-ls')) el('eff-ls').textContent = `Tax-free: ${fmtR(Math.min(state.planLumpSum, calc.lsTaxFreeLimit))} · Lump-sum tax: +${fmtR(calc.lsTax)}`;
  if (el('cap-don')) el('cap-don').innerHTML = `Max deductible: <strong>${fmtR(calc.donMaxDed)}</strong> (10% of TI)`;
  if (el('eff-don')) el('eff-don').textContent = `Tax saved: ${fmtR(donSaved)}${calc.donExcess>0?' · Excess c/fwd: '+fmtR(calc.donExcess):''}`;

  if (el('annual-note')) el('annual-note').innerHTML = `Annualisation factor <strong>×${calc.k.toFixed(2)}</strong> applied to variable income & costs (business, rental, investments).`;
  if (el('biz-ann-echo')) el('biz-ann-echo').innerHTML = `Annualised turnover: <strong>${fmtR(calc.bizTurnAnn)}</strong> · Costs: <strong>${fmtR(calc.bizCostAnn)}</strong>`;
  if (el('prov-sched-wrap')) el('prov-sched-wrap').innerHTML = renderProvScheduleHtml(calc);

  if (el('live-est-bal')) {
    el('live-est-bal').textContent = calc.balance <= 0 ? 'Refund ' + fmtR(Math.abs(calc.balance)) : 'Payable ' + fmtR(calc.balance);
    el('live-est-bal').style.color = calc.balance <= 0 ? 'var(--mint)' : 'var(--red)';
  }
  renderInspector(calc);
}

          <select class="select-in"><option>USD</option><option>GBP</option><option>EUR</option></select>
          <input type="number" class="text-in mono" placeholder="Foreign amount" value="350">
          <input type="number" class="text-in mono" placeholder="Exchange rate" value="18.25">
          <input type="text" class="text-in mono" readonly value="R 6 388">
        </div></div>`;
    }).join('')}
  `;
}

function renderInspector(calcOpt) {
  const c = calcOpt || calcTaxPreview();
  document.getElementById('ins-yr').textContent = c.ty.label;
  document.getElementById('ins-goal-lens').textContent = computeGoalLens();
  document.getElementById('ins-state').textContent = JSON.stringify({
    step: state.step,
    goalLens: computeGoalLens(),
    period: state.period === 'sofar' ? `${state.monthsCovered} mo (x${c.k.toFixed(2)})` : 'full year',
    grossAnnualised: Math.round(c.grossAnn),
    raMaxDed: c.raMaxDed,
    donMaxDed: c.donMaxDed,
    medCredit: c.medTotal,
    lumpSumTax: c.lsTax,
    balance: Math.round(c.balance),
    irp6: { p1: c.p1Rec, p2: c.p2Rec, p3: c.p3Rec }
  }, null, 2);
}

function render() {
  document.getElementById('hdr-step').innerHTML = `Step<br>${state.step} of 4`;
  document.querySelectorAll('#stepper-indicators .stepper-dot').forEach(dot => {
    const s = Number(dot.dataset.step);
    dot.classList.toggle('active', s === state.step);
    dot.classList.toggle('completed', s < state.step);
  });
  document.getElementById('btn-back').style.display = state.step > 1 ? 'inline-flex' : 'none';
  const nextBtn = document.getElementById('btn-next');
  nextBtn.textContent = state.step < 4 ? 'Next' : 'Complete & Start';
  nextBtn.className = state.step < 4 ? 'btn btn-primary' : 'btn btn-complete';

  const host = document.getElementById('ob-content');
  if (state.step === 1) host.innerHTML = renderStep1();
  else if (state.step === 2) host.innerHTML = renderStep2();
  else if (state.step === 3) host.innerHTML = renderStep3();
  else host.innerHTML = renderStep4();
  host.scrollTop = 0;

  renderInspector();
}

render();
</script>
</body>
</html>
